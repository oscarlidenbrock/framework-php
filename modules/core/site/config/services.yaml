services:
  site.settings:
    class: Module\Site\SiteSettings
    arguments: ['@Framework\Config\ConfigManager', '@Framework\Database\DatabaseRegistry', '%framework.workspace%', '@?Framework\Security\RequestSecurityInterface']
    public: true
  Framework\Config\SiteSettingsInterface:
    alias: site.settings
    public: true
  site.settings_controller:
    class: Module\Site\Controller\SettingsController
    arguments: ['@site.settings', '@?admin.page_renderer', '@?Framework\Security\CsrfInterface', '@Symfony\Component\Routing\Generator\UrlGeneratorInterface', '@?Framework\Security\RequestSecurityInterface']
    public: true
  site.installation:
    class: Module\Site\InstallationManager
    arguments: ['%framework.root_path%', '%framework.workspace%', '%framework.installation_selection%', '@Framework\Config\ConfigManager', '@Framework\Database\DatabaseRegistry', '@Framework\Module\ModuleManager', '@Framework\Theme\ThemeManager', '@?Framework\Security\RequestSecurityInterface']
    public: true
  site.extensions_controller:
    class: Module\Site\Controller\ExtensionsController
    arguments: ['@site.installation', '@?admin.page_renderer', '@?Framework\Security\CsrfInterface', '@Symfony\Component\Routing\Generator\UrlGeneratorInterface', '@?Framework\Security\RequestSecurityInterface']
    public: true
